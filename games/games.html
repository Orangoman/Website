<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Flag Guesser</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <h1>Guess the Flag!</h1>
        <p>Score: <span id="score">0</span></p>
        
        <div class="flag-display">
            <!-- The src will be injected by JavaScript -->
            <img id="flag-image" src="" alt="Guess this flag" width="300">
        </div>

        <div class="input-area">
            <input type="text" id="guess-input" placeholder="Type country name..." autofocus autocomplete="off">
            <button id="submit-btn">Submit</button>
        </div>
        
        <p id="feedback"></p>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
