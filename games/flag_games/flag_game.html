<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Flag!</title>
    <!-- PeerJS Library for direct Browser-to-Browser Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

    <style>
        body { font-family: sans-serif; text-align: center; background-color: #f8f9fa; margin: 0; padding: 20px; }
        #game-container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .menu-btn { display: block; width: 220px; margin: 10px auto; padding: 12px 20px; font-size: 18px; cursor: pointer; border: none; border-radius: 6px; background-color: #007bff; color: white; font-weight: bold; }
        .menu-btn:hover { background-color: #0056b3; }
        .back-btn { margin-bottom: 15px; padding: 6px 12px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc; background: #e9ecef; }
        .settings { margin-bottom: 20px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
        .input-area { display: flex; flex-direction: row; justify-content: center; align-items: center; gap: 8px; margin-top: 15px; flex-wrap: wrap; }
        #guess-input, #mp-guess-input { padding: 10px; font-size: 16px; width: 200px; border: 1px solid #ccc; border-radius: 6px; }
        
        button { padding: 10px 16px; font-size: 16px; cursor: pointer; border-radius: 6px; border: none; font-weight: bold; }
        .submit-btn { background-color: #28a745; color: white; }
        .submit-btn:hover { opacity: 0.9; }
        
        .skip-btn { background-color: #fd7e14; color: white; }
        .skip-btn:hover { background-color: #e8590c; }
        .skip-btn:disabled { background-color: #adb5bd; cursor: not-allowed; }

        #flag-image, #mp-flag-image { max-width: 100%; height: auto; border: 2px solid #ddd; border-radius: 8px; margin-top: 10px; }
        #player-list { list-style: none; padding: 0; }
        #player-list li { background: #e9ecef; margin: 5px auto; width: 240px; padding: 8px; border-radius: 6px; font-weight: bold; }
        
        /* Leaderboard Styling */
        .leaderboard-box { background: #f1f3f5; border: 2px solid #dee2e6; border-radius: 8px; padding: 12px; margin: 15px 0; }
        .leaderboard-box h3 { margin: 0 0 10px 0; color: #343a40; }
        .leaderboard-list { list-style: none; padding: 0; margin: 0; }
        .leaderboard-list li { display: flex; justify-content: space-between; padding: 6px 12px; background: white; margin: 4px 0; border-radius: 4px; font-weight: bold; border: 1px solid #e9ecef; }
        .leaderboard-list li:first-child { background: #fff3cd; border-color: #ffeeba; color: #856404; } /* 1st place highlight */
        
        /* End Round Overlay */
        #round-over-box { background: #e2e3e5; border-radius: 8px; padding: 15px; margin-top: 15px; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Guess the Flag!</h1>

    <!-- 1. MAIN MENU -->
    <div id="main-menu">
        <h2>Choose Game Mode</h2>
        <button type="button" class="menu-btn" onclick="showSinglePlayer()">🎮 Single Player</button>
        <button type="button" class="menu-btn" onclick="showMultiplayer()">🌐 Multiplayer</button>
    </div>

    <!-- 2. SINGLE PLAYER SCREEN -->
    <div id="singleplayer-screen" hidden>
        <button type="button" class="back-btn" onclick="showMainMenu()">← Back to Menu</button>
        
        <div class="settings">
            <label>Region:
                <select id="region-select">
                    <option value="World">World</option>
                    <option value="Europe">Europe</option>
                    <option value="Asia">Asia</option>
                    <option value="North America">North America</option>
                    <option value="South America">South America</option>
                    <option value="Africa">Africa</option>
                    <option value="Oceania">Oceania</option>
                    <option value="Territories">Territories</option>
                </select>
            </label>

            <label>Mode:
                <select id="mode-select">
                    <option value="classic">Classic (Endless)</option>
                    <option value="timed">Timed (60s)</option>
                    <option value="survival">Survival (3 Lives)</option>
                </select>
            </label>
            
            <button type="button" id="start-btn" class="submit-btn">Start Game</button>
        </div>

        <hr>

        <div id="hud">
            <p>Score: <span id="score">0</span></p>
            <p id="timer-display" style="display:none;">Time: <span id="timer">60</span>s</p>
            <p id="lives-display" style="display:none;">Lives: <span id="lives">❤️❤️❤️</span></p>
        </div>

        <div id="game-area" hidden>
            <img id="flag-image" src="" alt="Guess this flag" width="300">
            <div class="input-area">
                <input type="text" id="guess-input" list="country-options" placeholder="Start typing..." autocomplete="off">
                <button type="button" id="submit-btn" class="submit-btn">Submit</button>
                <button type="button" id="skip-btn" class="skip-btn" onclick="skipFlag()">Skip</button>
            </div>
        </div>

        <p id="feedback"></p>
    </div>

    <!-- 3. MULTIPLAYER SCREEN -->
    <div id="multiplayer-screen" hidden>
        <button type="button" class="back-btn" onclick="showMainMenu()">← Back to Menu</button>
        
        <h2>Multiplayer Lobby</h2>
        <div class="lobby-controls" id="lobby-setup">
            <input type="text" id="player-name" placeholder="Enter Your Nickname">
            <br><br>
            <button type="button" id="create-room-btn" class="submit-btn" onclick="createLobby()">Create Lobby</button>
            <br><br>
            <input type="text" id="room-code-input" placeholder="Room Code (e.g. ABCD)">
            <button type="button" id="join-room-btn" class="submit-btn" onclick="joinLobby()">Join Lobby</button>
        </div>

        <div id="waiting-room" hidden>
            <hr>
            <h3>Room Code: <span id="display-room-code">----</span></h3>
            
            <!-- Host Lobby Settings -->
            <div class="settings" id="mp-settings-panel">
                <label>Region:
                    <select id="mp-region-select" onchange="updateMpSettings()">
                        <option value="World">World</option>
                        <option value="Europe">Europe</option>
                        <option value="Asia">Asia</option>
                        <option value="North America">North America</option>
                        <option value="South America">South America</option>
                        <option value="Africa">Africa</option>
                        <option value="Oceania">Oceania</option>
                        <option value="Territories">Territories</option>
                    </select>
                </label>

                <label>Mode:
                    <select id="mp-mode-select" onchange="updateMpSettings()">
                        <option value="timed">Timed (60s Speed Round)</option>
                        <option value="classic">Classic (Endless)</option>
                        <option value="survival">Survival (3 Lives)</option>
                    </select>
                </label>
            </div>

            <p id="lobby-status">Waiting for host to start...</p>
            <h4>Players Joined:</h4>
            <ul id="player-list"></ul>
            <br>
            <button type="button" id="start-multiplayer-btn" class="submit-btn" onclick="startMultiplayerGame()" hidden>Start Game for Everyone</button>
        </div>

        <!-- Shared Flag Board & Live Leaderboard for Multiplayer -->
        <div id="mp-game-area" hidden>
            <hr>
            
            <!-- Live Leaderboard -->
            <div class="leaderboard-box">
                <h3>🏆 Cumulative Leaderboard</h3>
                <ul id="mp-leaderboard-list" class="leaderboard-list"></ul>
            </div>

            <div id="mp-hud">
                <p id="mp-timer-display" style="display:none;">Time Remaining: <span id="mp-timer">60</span>s</p>
                <p id="mp-lives-display" style="display:none;">Lives: <span id="mp-lives">❤️❤️❤️</span></p>
            </div>

            <div id="mp-active-game">
                <img id="mp-flag-image" src="" alt="Guess this flag" width="300">
                <div class="input-area">
                    <input type="text" id="mp-guess-input" list="country-options" placeholder="Start typing..." autocomplete="off">
                    <button type="button" id="mp-submit-btn" class="submit-btn">Submit</button>
                    <button type="button" id="mp-skip-btn" class="skip-btn" onclick="skipFlag()">Skip</button>
                </div>
                <p id="mp-feedback"></p>
            </div>

            <!-- Round Over Box -->
            <div id="round-over-box" hidden>
                <h2>🏁 Round Ended!</h2>
                <p id="round-winner-text"></p>
                <button type="button" id="mp-play-again-btn" class="submit-btn" onclick="playAgainMultiplayer()" hidden>🔄 Play Next Round</button>
            </div>
        </div>
    </div>
</div>

<datalist id="country-options"></datalist>

<script src="script.js?v=4000"></script>
</body>
</html>
