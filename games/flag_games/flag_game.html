<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the Flag!</title>

    <style>
        /* Center container and stack elements vertically */
        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            font-family: sans-serif;
        }

        /* Stack flag image and input area vertically */
        #game-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Adds space between flag and text box */
            margin-top: 15px;
        }

        /* Prevent flag from overflowing on small screens */
        #flag-image {
            max-width: 100%;
            height: auto;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        /* Keep input box and submit button neat */
        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }

        #guess-input {
            padding: 8px 12px;
            font-size: 16px;
            width: 250px;
            text-align: center;
        }

        #submit-btn, #start-btn {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>Guess the Flag!</h1>

    <!-- Category & Mode Settings -->
    <div class="settings">
        <label>Region:
            <select id="region-select">
                <option value="World">World</option>
                <option value="Europe">Europe</option>
                <option value="Asia">Asia</option>
                <option value="North America">North America</option>
                <option value="South America">South America</option>
                <option value="Africa">Africa</option>
                <option value="Oceania">Oceania</option>
                <option value="Territories">Territories</option>
            </select>
        </label>

        <label>Mode:
            <select id="mode-select">
                <option value="classic">Classic (Endless)</option>
                <option value="timed">Timed (60s)</option>
                <option value="survival">Survival (3 Lives)</option>
            </select>
        </label>
        
        <button type="button" id="start-btn">Start Game</button>
    </div>

    <hr>

    <!-- Score HUD -->
    <div id="hud">
        <p>Score: <span id="score">0</span></p>
        <p id="timer-display" style="display:none;">Time: <span id="timer">60</span>s</p>
        <p id="lives-display" style="display:none;">Lives: <span id="lives">❤️❤️❤️</span></p>
    </div>

    <!-- GAME AREA: 'hidden' keeps this invisible until Start Game is clicked -->
    <div id="game-area" hidden>
        <img id="flag-image" src="" alt="Guess this flag" width="300">
        
        <div class="input-area">
            <input type="text" id="guess-input" list="country-options" placeholder="Start typing..." autocomplete="off">
            <datalist id="country-options"></datalist>
            <button type="button" id="submit-btn">Submit</button>
        </div>
    </div>

    <p id="feedback"></p>
</div>

<script src="script.js?v=5"></script>
</body>
</html>
